name: Update Media Data & Generate Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-media-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate GAS_URL
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          if [ -z "$GAS_URL" ]; then
            echo "::error::GAS_URL repository secret is missing or empty."
            exit 1
          fi

          case "$GAS_URL" in
            https://script.google.com/*/exec|https://script.googleusercontent.com/*)
              ;;
            *)
              echo "::error::GAS_URL must be a deployed Google Apps Script /exec URL."
              exit 1
              ;;
          esac

      - name: Download live media feed
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --max-time 60 \
            --get \
            --data-urlencode "action=json" \
            "$GAS_URL" \
            --output raw_data.json

          if [ ! -s raw_data.json ]; then
            echo "::error::Apps Script returned an empty feed."
            exit 1
          fi

          jq empty raw_data.json

      - name: Generate permanent index and review pages
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          node generate-pages.js

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json index.html pages/ app.js style.css index.template.html

          if git diff --cached --quiet; then
            echo "No media or generated-page changes to commit."
            exit 0
          fi

          git commit -m "chore: sync media feed and generated SEO pages [skip ci]"
          git push origin HEAD:main
